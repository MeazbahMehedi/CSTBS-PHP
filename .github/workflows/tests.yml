name: PHP and MariaDB CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: testing-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      CSTBS_DB_HOST: 127.0.0.1
      CSTBS_DB_PORT: 3306
      CSTBS_DB_USER: root
      CSTBS_DB_PASSWORD: testing-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, gd, dom, xml, zip, curl
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit
      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: MariaDB and HTTP integration
        run: php tests/integration.php
      - name: JavaScript syntax
        run: |
          node --check public/assets/js/main.js
          node --check public/assets/js/motion.js
          node --check public/assets/js/seats.js
          node --check public/assets/js/scanner.js
